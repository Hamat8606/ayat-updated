name: Generate Al-Fatiha Russian audio test
on:
  push:
    branches:
      - experiment/russian-audio-translation
    paths:
      - 'tools/generate_ru_audio.py'
      - 'index.html'
      - '.github/workflows/generate-fatiha-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-test-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/russian-audio-translation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Edge TTS
        run: python -m pip install --upgrade pip edge-tts

      - name: Generate Al-Fatiha (7 verses only)
        run: python tools/generate_ru_audio.py --surah 1 --voice ru-RU-SvetlanaNeural

      - name: Verify MP3 files and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("generated-audio")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = [f"1:{i}" for i in range(1, 8)]
          missing = [key for key in expected if key not in manifest]
          assert not missing, f"Manifest missing verses: {missing}"
          files = []
          for ayah in range(1, 8):
              path = root / "ru" / "1" / f"{ayah}.mp3"
              assert path.is_file(), f"Missing MP3: {path}"
              size = path.stat().st_size
              assert size > 1000, f"MP3 unexpectedly small: {path} ({size} bytes)"
              files.append((path.as_posix(), size))
          print("Verified seven non-empty MP3 files:")
          for path, size in files:
              print(f"{path}: {size:,} bytes")
          print(f"Manifest entries for Al-Fatiha: {sum(1 for k in manifest if k.startswith('1:'))}")
          PY

      - name: Build a local listening page
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("generated-audio")
          cards = []
          for ayah in range(1, 8):
              cards.append(f"""
              <section><h2>Аят {ayah}</h2>
                <audio controls preload="none" src="ru/1/{ayah}.mp3"></audio>
                <p><a href="ru/1/{ayah}.mp3" download>Скачать MP3</a></p>
              </section>""")
          html = """<!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Аят — тест русской озвучки Аль-Фатихи</title>
          <style>body{font:17px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.5}section{padding:12px 0;border-bottom:1px solid #ddd}audio{width:100%}</style>
          </head><body><h1>Аль-Фатиха — тест русской озвучки</h1>
          <p>Экспериментальная генерация Edge TTS. Это локальная тестовая страница внутри артефакта; она не публикуется в основной версии приложения.</p>
          """ + "\n".join(cards) + "</body></html>"
          (root / "preview.html").write_text(html, encoding="utf-8")
          PY

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: ayat-al-fatiha-russian-audio-test
          path: generated-audio/
          if-no-files-found: error
          retention-days: 14
