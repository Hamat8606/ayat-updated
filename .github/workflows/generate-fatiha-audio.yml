name: Generate Al-Fatiha Russian audio test
on:
  push:
    branches:
      - experiment/russian-audio-translation
    paths:
      - 'tools/generate_ru_audio.py'
      - 'index.html'
      - '.github/workflows/generate-fatiha-audio.yml'
      - 'audio-test.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-test-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/russian-audio-translation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Edge TTS
        run: python -m pip install --upgrade pip edge-tts

      - name: Obtain source recording from IslamHouse
        run: |
          mkdir -p generated-audio/source
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://d1.islamhouse.com/data/ru/ih_sounds/chain/ru_Quran_Russian/ru_Quran_Russian_001.mp3' \
            --output generated-audio/source/ru_Quran_Russian_001.mp3
          test -s generated-audio/source/ru_Quran_Russian_001.mp3
          file generated-audio/source/ru_Quran_Russian_001.mp3
          wc -c generated-audio/source/ru_Quran_Russian_001.mp3

      - name: Generate Al-Fatiha (7 verses only)
        run: python tools/generate_ru_audio.py --surah 1 --voice ru-RU-SvetlanaNeural

      - name: Verify MP3 files and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("generated-audio")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = [f"1:{i}" for i in range(1, 8)]
          missing = [key for key in expected if key not in manifest]
          assert not missing, f"Manifest missing verses: {missing}"
          for ayah in range(1, 8):
              path = root / "ru" / "1" / f"{ayah}.mp3"
              assert path.is_file() and path.stat().st_size > 1000, f"Invalid MP3: {path}"
          source = root / "source" / "ru_Quran_Russian_001.mp3"
          assert source.is_file() and source.stat().st_size > 1000, "Source recording missing"
          print("Verified seven generated MP3 files and source recording.")
          PY

      - name: Build a local listening page
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("generated-audio")
          cards = ['<section><h2>Исходная запись IslamHouse</h2><audio controls preload="none" src="source/ru_Quran_Russian_001.mp3"></audio></section>']
          for ayah in range(1, 8):
              cards.append(f'<section><h2>Синтезированный аят {ayah}</h2><audio controls preload="none" src="ru/1/{ayah}.mp3"></audio></section>')
          html = '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аят — тест русской озвучки</title><style>body{font:17px system-ui;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.5}section{padding:12px 0;border-bottom:1px solid #ddd}audio{width:100%}</style></head><body><h1>Аль-Фатиха — тест русской озвучки</h1>' + ''.join(cards) + '</body></html>'
          (root / "preview.html").write_text(html, encoding="utf-8")
          PY

      - name: Publish only test MP3 assets to the experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-audio/ru generated-audio/manifest.json generated-audio/preview.html
          if git diff --cached --quiet; then
            echo "No generated audio changes to commit."
          else
            git commit -m "Add generated Al-Fatiha audio for isolated integration test"
            git push origin HEAD:experiment/russian-audio-translation
          fi

      - name: Upload source and test package
        uses: actions/upload-artifact@v4
        with:
          name: ayat-al-fatiha-russian-audio-test
          path: generated-audio/
          if-no-files-found: error
          retention-days: 14
