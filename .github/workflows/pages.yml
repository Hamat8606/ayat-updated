name: Deploy Ayat to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML, manifest and JavaScript before deployment
        run: |
          python - <<'PY'
          import json, re
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          Path("sw.js").read_text(encoding="utf-8")

          required = ["theme", "lg", "ref", "arabic", "tr", "btn", "st",
                      "audioToggle", "suraAudio", "playAudio", "pauseAudio",
                      "cacheAudio", "suraPlayer", "audioStatus", "ta",
                      "cp", "clearLog", "closeLog"]
          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)
          checker = Checker()
          checker.feed(html)
          duplicates = sorted({x for x in checker.ids if checker.ids.count(x) > 1})
          missing = [x for x in required if x not in checker.ids]
          if duplicates:
              raise SystemExit("Duplicate HTML ids: " + ", ".join(duplicates))
          if missing:
              raise SystemExit("Missing required HTML ids: " + ", ".join(missing))
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, re.I | re.S)
          n = 0
          for attrs, body in scripts:
              if re.search(r"type\s*=\s*['\"]application/json['\"]", attrs, re.I):
                  continue
              n += 1
              Path(f"/tmp/ayat-script-{n}.js").write_text(body, encoding="utf-8")
          if not n:
              raise SystemExit("No executable inline scripts found")
          print(f"HTML and manifest valid; found {n} executable inline scripts.")
          PY
          node --check sw.js
          for file in /tmp/ayat-script-*.js; do
            node --check "$file"
          done
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          PAGE_URL="${PAGE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$PAGE_URL/" -o /tmp/ayat-live.html
          curl --fail --silent --show-error --location "$PAGE_URL/manifest.json" -o /tmp/ayat-live-manifest.json
          curl --fail --silent --show-error --location "$PAGE_URL/sw.js" -o /tmp/ayat-live-sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path("/tmp/ayat-live.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("/tmp/ayat-live-manifest.json").read_text(encoding="utf-8"))
          sw = Path("/tmp/ayat-live-sw.js").read_text(encoding="utf-8")
          for marker in ['id="arabic"', 'id="btn"', 'id="cacheAudio"', 'id="suraAudio"']:
              if marker not in html:
                  raise SystemExit("Published page is missing: " + marker)
          if not manifest.get("name", "").startswith("Аят"):
              raise SystemExit("Published manifest is invalid")
          if "ayat-audio-v1" not in html and "ayat-audio-v1" not in sw:
              raise SystemExit("Audio cache support is missing from published assets")
          print("Published HTML, manifest and service worker passed smoke tests.")
          PY
